<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P&amp;T AI SQUARE</title><link rel="icon" type="image/svg+xml" href="/static/brand/pt-ai-square-symbol.svg"><link rel="stylesheet" href="/static/app.css"><script defer src="/static/lucide.min.js"></script><script defer src="/static/app.js"></script><link rel="stylesheet" href="/static/workspace.css"><link rel="stylesheet" href="/static/people.css"><link rel="stylesheet" href="/static/grants.css"><link rel="stylesheet" href="/static/immersion-room.css"><link rel="stylesheet" href="/static/room-admin.css"></head><body>

<div id="square-app" lang="ko">
  <header class="sq-header"><div class="sq-header-inner">
    <a class="sq-brand cursor-interaction" href="/" data-action="home" lang="en" aria-label="P&amp;T AI SQUARE 홈으로 이동"><img class="sq-logo" src="/static/brand/pt-ai-square-symbol.svg" width="34" height="34" alt="">P&amp;T AI SQUARE<span class="sq-demo">사내 공유</span></a>
    <nav aria-label="주 메뉴"><a class="cursor-interaction" href="/" data-action="home" data-route="home" aria-current="page">홈</a><button class="cursor-interaction" data-action="browse" data-route="browse">둘러보기</button></nav>
    <div class="sq-header-actions"><span class="sq-session" id="sq-session"></span><button class="sq-quiet cursor-interaction" data-action="fullscreen" aria-label="전체화면 전환"><i data-lucide="maximize"></i></button><button class="sq-quiet cursor-interaction" data-action="logout" title="로그아웃"><i data-lucide="log-out"></i></button><button class="sq-quiet cursor-interaction" data-action="manage" aria-label="운영 관리"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>운영 관리</span></button><button class="sq-primary cursor-interaction" data-action="register"><i data-lucide="plus" aria-hidden="true"></i>도구 등록</button></div>
  </div></header>
  <div class="sq-resources"><div><span>처음 등록하시나요?</span><div class="sq-resource-buttons">{% if config['DATA_MODE'] != 'dummy' %}<a class="sq-link cursor-interaction" href="{{ url_for('local_access.page') }}">로컬에서 받기 <i data-lucide="app-window" aria-hidden="true"></i></a>{% endif %}<button class="sq-link cursor-interaction" data-action="distribution-skill"><i data-lucide="package" aria-hidden="true"></i>파일 배포 Skill <i data-lucide="chevron-right" aria-hidden="true"></i></button><button class="sq-link cursor-interaction" data-action="download-guide"><i data-lucide="download" aria-hidden="true"></i>가이드 다운로드</button></div></div></div>
  <div class="sq-shell">
    <section class="sq-heading"><div><h1 id="sq-page-title">좋은 도구가 모이는 곳.</h1><p id="sq-page-description">동료의 노하우를, 당신의 업무로.</p></div></section>
    <div class="sq-toolbar"><div class="sq-platforms" id="sq-filter-tabs" role="group" aria-label="도구 유형"></div><form class="sq-search" id="sq-search-form" role="search"><i data-lucide="search" aria-hidden="true"></i><input id="sq-query" type="search" placeholder="도구·등록자 이름 또는 관련 업무 검색" aria-label="도구 이름, 등록자 이름, 설명, 관련 업무 검색"><button class="cursor-interaction" aria-label="검색하여 둘러보기로 이동"><i data-lucide="arrow-right" aria-hidden="true"></i></button></form></div>
    <main id="sq-main">
      <section id="sq-home" class="sq-home" aria-label="홈">
        <section class="sq-chart" aria-labelledby="sq-chart-title"><div class="sq-section-head"><div><h2 id="sq-chart-title">동료들이 많이 찾는 도구</h2><p><span id="sq-chart-time">14:00</span> 기준 · <span id="sq-rank-period">최근 7일</span></p></div><button class="sq-icon cursor-interaction" data-action="rank-info" aria-label="순위 집계 기준"><i data-lucide="info" aria-hidden="true"></i></button></div>
          <div class="sq-chart-card"><div class="sq-chart-labels"><span id="sq-rank-range" class="sq-sr">실시간 순위</span><div class="sq-rank-modes" role="group" aria-label="순위 집계 기간"><button type="button" data-action="rank-mode" data-mode="recent" aria-pressed="true">실시간</button><button type="button" data-action="rank-mode" data-mode="total" aria-pressed="false">누적</button></div><span>좋아요 · 다운로드</span></div><div class="sq-rank-window"><div id="sq-rank-list"></div></div>
          <div class="sq-chart-controls"><div class="sq-rank-pages" aria-label="순위 페이지"><button class="cursor-interaction" data-action="rank-page" data-page="0" aria-pressed="true">1–5<span></span></button><button class="cursor-interaction" data-action="rank-page" data-page="1" aria-pressed="false">6–10<span></span></button></div></div><button id="sq-rank-all" class="sq-link cursor-interaction" data-action="clear-filters" style="margin-top:6px" hidden>도구 10개 모두 보기 <i data-lucide="chevron-right" aria-hidden="true"></i></button></div>
        </section>
        <div class="sq-home-shelves"><section aria-labelledby="sq-download-title"><div class="sq-section-head"><div><h2 id="sq-download-title">최다 다운로드 도구</h2><p>동료들이 자주 꺼내 쓰는 도구.</p></div><button class="sq-link cursor-interaction" data-action="browse-downloads">모두 보기 <i data-lucide="chevron-right" aria-hidden="true"></i></button></div><div id="sq-popular" class="sq-shelf-grid"></div></section><section aria-labelledby="sq-recent-title"><div class="sq-section-head"><div><h2 id="sq-recent-title">최근 업로드 도구</h2><p>새롭게 도착한 아이디어를 만나보세요.</p></div><button class="sq-link cursor-interaction" data-action="browse-recent">모두 보기 <i data-lucide="chevron-right" aria-hidden="true"></i></button></div><div id="sq-recent" class="sq-shelf-grid"></div></section></div>
      </section>
      <section id="sq-browse" hidden aria-label="둘러보기"><div class="sq-browse-filters"><div class="sq-type-chips" id="sq-types"></div><div class="sq-browse-options"><label><span class="sq-sr">업무 분야</span><select id="sq-category"><option>모든 업무</option><option>공통 업무</option><option>제조</option><option>장비</option><option>기술</option></select></label><label><span class="sq-sr">정렬</span><select id="sq-sort"><option value="discovery">기본 배치</option><option value="recent">최근 업로드순</option><option value="downloads">다운로드순</option><option value="name">이름순</option></select></label></div></div><div class="sq-result-head"><span id="sq-result-count"></span><button class="sq-link cursor-interaction" data-action="clear-filters">필터 초기화</button></div><div id="sq-catalog" class="sq-catalog"></div><div class="sq-catalog-pages" id="sq-catalog-pages"></div></section>
    </main>
    <div class="sq-bottom"><span><i data-lucide="package" aria-hidden="true"></i>팀에서 만든 도구, 함께 쓰면 더 유용해집니다.</span><div class="sq-row-actions"><button class="sq-link cursor-interaction" data-action="idea">아이디어 제안</button><button class="sq-link cursor-interaction" data-action="creator-guide">등록 가이드 <i data-lucide="book-open" aria-hidden="true"></i></button></div></div>
    <p id="sq-status" class="sq-status" role="status" aria-live="polite"></p>
  </div>
  <dialog id="sq-dialog" aria-labelledby="sq-dialog-title"><div class="sq-modal-head"><div><span id="sq-dialog-kicker" class="sq-kicker"></span><h2 id="sq-dialog-title"></h2></div><button class="sq-icon cursor-interaction" data-action="close-dialog" aria-label="팝업 닫기" autofocus><i data-lucide="x" aria-hidden="true"></i></button></div><div id="sq-dialog-body"></div><p id="sq-modal-status" role="status" aria-live="polite"></p></dialog>
  <dialog id="sq-confirm" aria-labelledby="sq-confirm-title"><div class="sq-confirm-content"><span class="sq-feature-icon"><i data-lucide="rotate-ccw" aria-hidden="true"></i></span><h2 id="sq-confirm-title"></h2><p id="sq-confirm-copy"></p><div id="sq-confirm-extra"></div><div class="sq-actions"><button class="sq-secondary cursor-interaction" data-action="cancel-confirm">취소</button><button id="sq-confirm-go" class="sq-primary cursor-interaction" data-action="confirm">확인</button></div></div></dialog>
</div>
</body></html>
