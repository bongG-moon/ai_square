<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P&amp;T AI SQUARE · 로그인</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main id="square-app"><div style="max-width:430px;margin:12vh auto;padding:36px;background:rgba(255,255,255,.85);border:1px solid white;border-radius:28px;box-shadow:0 20px 60px #00000009"><p lang="en" style="font-size:13px;letter-spacing:.1em">P&amp;T AI SQUARE</p><h1 style="font-size:30px;margin:20px 0">좋은 도구가 모이는 곳.</h1><p class="sq-note">동료의 노하우를, 당신의 업무로.</p>
{% if error %}<p class="sq-error" role="alert">{{ error }}</p>{% endif %}
{% if mode == 'local' %}<form method="post" style="display:grid;gap:20px;margin-top:30px"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label class="sq-field"><span>계정 ID</span><input name="user_id" autocomplete="username" required maxlength="100"></label><label class="sq-field"><span>비밀번호</span><input type="password" name="password" autocomplete="current-password" required></label><button class="sq-primary cursor-interaction">로그인</button><p class="sq-note">처음 사용하는 경우 운영자에게 계정 발급을 요청하세요.</p></form>{% else %}<p class="sq-note" style="margin-top:30px">SSO 사용 설정과 사내 인증 모듈을 운영자가 확인해야 합니다.</p>{% endif %}
</div></main></body></html>
