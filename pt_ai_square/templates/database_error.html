<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P&amp;T AI SQUARE · 데이터 처리 안내</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.7}
    main{max-width:600px;margin:12vh auto;padding:36px;background:rgba(255,255,255,.94);border:1px solid white;border-radius:28px;box-shadow:0 20px 60px #00000009}
    .brand{font-size:13px;letter-spacing:.08em}h1{font-size:27px;line-height:1.4;letter-spacing:-.8px}p{color:#6e6e73}dl{padding:18px 20px;background:#f5f5f7;border-radius:16px;font-size:14px}dt{color:#6e6e73}dd{margin:0 0 12px;overflow-wrap:anywhere}dd:last-child{margin-bottom:0}code{font-family:Consolas,monospace;font-size:15px;color:#1d1d1f;user-select:all}
    a{display:inline-block;margin-top:8px;padding:9px 19px;background:#4870df;color:white;text-decoration:none;border-radius:24px}a:focus-visible{outline:3px solid #1d1d1f;outline-offset:3px}@media(max-width:640px){main{margin:8vh 16px;padding:26px}}
  </style>
</head>
<body>
  <main>
    <div class="brand">P&amp;T AI SQUARE</div>
    <h1>데이터 처리 상태를 확인해 주세요.</h1>
    <p role="alert">{{ diagnostic.message }}</p>
    <dl>
      <dt>진단 코드</dt><dd><code>{{ diagnostic.code }}</code></dd>
      {% if diagnostic.mongo_code is not none %}<dt>MongoDB 코드</dt><dd><code>{{ diagnostic.mongo_code }}</code></dd>{% endif %}
      <dt>문의 번호</dt><dd><code>{{ diagnostic.reference }}</code></dd>
    </dl>
    <p>{{ guidance }}</p>
    <p>로그를 확인하기 어렵다면 위 코드와 문의 번호, 오류가 발생한 작업을 운영자에게 전달해 주세요.</p>
    <a href="{{ url_for('index') }}">홈으로 이동</a>
  </main>
</body>
</html>
